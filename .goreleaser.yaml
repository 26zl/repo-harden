version: 2

project_name: repo-harden

builds:
  - main: ./cmd/repo-harden
    binary: repo-harden
    env: [CGO_ENABLED=0]
    # Strip local build paths for reproducible binaries.
    flags: [-trimpath]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Use the commit timestamp for reproducible archives.
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_LICENSES.txt
      - audit-report.schema.json

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive
    cmd: bash
    args: ["../scripts/generate-sbom.sh", "$artifact", "$document"]
    env:
      - REPO_HARDEN_SBOM_CREATED={{ .CommitDate }}
      - SYFT_FILE_METADATA_CATALOGER_ENABLED=true
    documents:
      - "${artifact}.sbom.json"
